<title>Section Portal — EELU IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#101827;--bg-deep:#0b1220;--panel:rgba(19,30,48,.92);--border:rgba(148,163,184,.22);--border-strong:rgba(125,211,252,.38);--text:#edf2f7;--muted:#9fb0c7;--muted-soft:#6f8099;--accent:#7dd3fc;--accent-strong:#38bdf8;--warm:#f8d49b;--danger:#fb7185;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at top left,rgba(56,189,248,.16),transparent 34%),radial-gradient(circle at 84% 8%,rgba(248,212,155,.1),transparent 30%),linear-gradient(135deg,var(--bg-deep),var(--bg));font-family:'Cormorant Garamond',serif;color:var(--text);overflow-x:hidden;padding-top:env(safe-area-inset-top,0)}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.48}
.portal{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px calc(40px + env(safe-area-inset-bottom,0))}
.mono{font-family:'DM Mono',monospace}
.crest{display:flex;flex-direction:column;align-items:center;margin-bottom:36px;text-align:center;animation:fd .75s ease both}
.orn{font-family:'DM Mono',monospace;font-size:19px;color:var(--warm);letter-spacing:8px;margin-bottom:12px;text-shadow:0 0 22px rgba(248,212,155,.25)}
.h-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.h-main{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,52px);font-weight:700;letter-spacing:1.5px;text-shadow:0 18px 44px rgba(0,0,0,.32)}
.h-sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;margin-top:8px}
.divider{display:flex;align-items:center;gap:12px;margin-top:22px;width:min(420px,82vw)}
.dl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(125,211,252,.45),transparent)}
.dd{width:7px;height:7px;background:var(--warm);transform:rotate(45deg);box-shadow:0 0 16px rgba(248,212,155,.45)}
.search{animation:fu .8s ease .18s both;width:100%;max-width:560px;margin-bottom:34px}
.s-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:14px;display:block}
.s-row{display:flex;border:1px solid var(--border-strong);background:rgba(15,23,42,.86);box-shadow:0 18px 50px rgba(0,0,0,.2);border-radius:18px;overflow:hidden;transition:box-shadow .3s}
.s-row:focus-within{box-shadow:0 0 0 3px rgba(56,189,248,.18),0 18px 50px rgba(0,0,0,.2)}
.s-in{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:18px 22px;font-family:'DM Mono',monospace;font-size:16px;color:var(--text);letter-spacing:3px}
.s-in::placeholder{color:var(--muted-soft);letter-spacing:1px}
.s-btn{background:linear-gradient(135deg,var(--accent),var(--accent-strong));border:0;cursor:pointer;padding:0 30px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2.5px;color:#07111f;text-transform:uppercase;font-weight:500;transition:.2s}
.s-btn:hover{filter:brightness(1.08);box-shadow:0 0 28px rgba(56,189,248,.26)}
#results{width:100%;max-width:860px}
.card{background:var(--panel);border:1px solid var(--border);margin-bottom:28px;animation:si .48s ease both;position:relative;overflow:hidden;border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.25);backdrop-filter:blur(12px)}
.card::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--accent),var(--warm),transparent)}
.st-head{padding:30px 34px;border-bottom:1px solid rgba(148,163,184,.12);display:flex;align-items:flex-start;gap:20px}
.avatar{width:58px;height:58px;border:1px solid rgba(125,211,252,.38);border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:20px;color:var(--warm);flex-shrink:0;background:rgba(15,23,42,.72)}
.st-info{flex:1;min-width:0}
.st-name{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,30px);font-weight:600;margin-bottom:7px;line-height:1.2}
.st-id{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:2.5px}
.pill{padding:8px 14px;background:rgba(15,23,42,.7);border:1px solid rgba(125,211,252,.22);border-radius:999px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pill.g{color:var(--warm);border-color:rgba(248,212,155,.35)}
.banner{padding:14px 34px;background:linear-gradient(90deg,rgba(248,212,155,.14),rgba(56,189,248,.1));border-bottom:1px solid rgba(248,212,155,.2);font-size:18px;color:var(--warm);display:flex;gap:12px;align-items:center}
.banner svg{flex-shrink:0;animation:ring 2.4s ease-in-out infinite;transform-origin:top center}
.cd{padding:26px 34px;border-bottom:1px solid rgba(148,163,184,.12);background:linear-gradient(135deg,rgba(14,165,233,.1),rgba(248,212,155,.06))}
.lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cd-sub{font-family:'Playfair Display',serif;font-size:20px;color:var(--warm);margin-bottom:6px}
.cd-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:16px;letter-spacing:.7px}
.timer{display:flex;gap:14px;flex-wrap:wrap}
.tu{display:flex;flex-direction:column;align-items:center;gap:7px}
.tn{font-family:'DM Mono',monospace;font-size:28px;line-height:1;min-width:66px;text-align:center;border:1px solid rgba(125,211,252,.24);padding:11px 8px;background:rgba(15,23,42,.72);border-radius:14px;letter-spacing:1px}
.tl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted-soft)}
.sec{padding:16px 34px 10px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);background:rgba(15,23,42,.35);border-bottom:1px solid rgba(148,163,184,.09);display:flex;justify-content:space-between}
.sec b{font-weight:400;color:var(--warm)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding:20px 34px;border-bottom:1px solid rgba(148,163,184,.09);transition:background .2s,transform .2s;position:relative;animation:si .5s ease both;animation-delay:calc(var(--i,0)*45ms)}
.row:hover{background:rgba(125,211,252,.05);transform:translateX(4px)}
.row.next{background:rgba(56,189,248,.08)}
.row.next::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 8px 8px 0;background:var(--accent);box-shadow:2px 0 14px rgba(125,211,252,.35)}
.r-sub{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;margin-bottom:6px}
.r-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.7px;line-height:1.7}
.tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.room{font-family:'DM Mono',monospace;font-size:11px;color:var(--warm);padding:7px 13px;border:1px solid rgba(248,212,155,.25);background:rgba(15,23,42,.72);border-radius:999px;letter-spacing:1.4px;white-space:nowrap}
.mode{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;padding:7px 12px;border-radius:999px;border:1px solid}
.FTF{color:#86efac;border-color:rgba(134,239,172,.4);background:rgba(134,239,172,.08)}
.VCR{color:var(--accent);border-color:rgba(125,211,252,.4);background:rgba(125,211,252,.08)}
.SEC{color:var(--warm);border-color:rgba(248,212,155,.4);background:rgba(248,212,155,.08)}.LEC{color:var(--muted);border-color:var(--border)}
.today{color:#07111f;background:var(--accent);border-radius:999px;padding:2px 9px;font-size:8px;letter-spacing:2px;margin-left:8px}
.badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:#07111f;background:var(--accent);border-radius:999px;padding:3px 9px;display:inline-block;margin-bottom:7px}
.note-row{padding:16px 34px;border-bottom:1px solid rgba(148,163,184,.09);font-size:18px;line-height:1.5}
.note-row small{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-bottom:4px}
.nf{text-align:center;padding:52px 24px;background:rgba(19,30,48,.74);border:1px solid var(--border);border-radius:24px;animation:fu .38s ease both}
.nf i{font-family:'DM Mono',monospace;font-style:normal;font-size:13px;color:var(--accent);letter-spacing:2px;display:block;margin-bottom:18px}
.nf h3{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:10px;font-weight:500}
.nf p{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:1.5px;line-height:1.8}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.dot{width:7px;height:7px;background:var(--accent);border-radius:99px;animation:pl 1.2s ease-in-out infinite;box-shadow:0 0 12px rgba(125,211,252,.55)}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
.arrow{position:fixed;font-family:'DM Mono',monospace;font-size:28px;color:var(--warm);pointer-events:none;z-index:50;opacity:0;text-shadow:0 0 16px rgba(248,212,155,.45)}
footer{margin-top:auto;padding-top:36px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:fu .8s ease .4s both}
.socials{display:flex;gap:14px}
.soc{width:52px;height:52px;border-radius:18px;border:1px solid rgba(148,163,184,.22);background:rgba(15,23,42,.7);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .3s cubic-bezier(.3,1.6,.5,1),color .25s,border-color .25s,box-shadow .25s;animation:fl 4s ease-in-out infinite}
.soc:nth-child(2){animation-delay:.5s}.soc:nth-child(3){animation-delay:1s}
.soc svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.soc:hover{transform:translateY(-6px) scale(1.12) rotate(-4deg);color:var(--c);border-color:var(--c);box-shadow:0 10px 30px -6px var(--c)}
.credit{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--muted-soft);display:flex;align-items:center;gap:10px}
.lock{background:none;border:0;color:var(--muted-soft);cursor:pointer;opacity:.5;transition:.2s;display:flex}
.lock:hover{opacity:1;color:var(--warm);transform:rotate(-8deg)}
.lock svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#modal{position:fixed;inset:0;z-index:100;background:rgba(5,10,20,.78);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0)) 14px 24px;overflow-y:auto}
#modal.on{display:flex}
.mbox{width:100%;max-width:640px;background:#131e30;border:1px solid var(--border-strong);border-radius:22px;padding:26px;animation:fu .35s ease both;position:relative}
.mbox h2{font-family:'Playfair Display',serif;font-weight:600;font-size:24px;margin-bottom:16px}
.x{position:absolute;top:14px;right:16px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
.tab.on{background:var(--accent);color:#07111f;border-color:var(--accent)}
.mbox label{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.mbox input:not([type=checkbox]),.mbox select{display:block;width:100%;margin-top:6px;background:rgba(15,23,42,.9);border:1px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;outline:0}
.mbox input:focus,.mbox select:focus{border-color:var(--accent)}
.btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:11px 18px;border-radius:12px;border:0;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#07111f;margin:4px 6px 4px 0;transition:.2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.o{background:transparent;color:var(--muted);border:1px solid var(--border)}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;font-size:17px}
.item small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px}
.del{background:none;border:0;color:var(--danger);cursor:pointer;font-size:18px}
.gl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}.gs{display:flex;gap:10px;margin:6px 0 12px}.gs label{display:flex;align-items:center;gap:8px;margin:0;padding:9px 14px;border:1px solid var(--border);border-radius:12px;cursor:pointer;color:var(--text)}.gs input{accent-color:#38bdf8}
.err{color:var(--danger);font-family:'DM Mono',monospace;font-size:11px;margin-top:8px}
.hint{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted-soft);line-height:1.7;margin:10px 0}
@keyframes ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes arrowFly{0%{opacity:0;transform:translateX(0) scale(.4)}15%,85%{opacity:1}100%{opacity:0;transform:translateX(var(--dx)) scale(1.1)}}
@keyframes fd{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
@keyframes fu{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes si{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes pl{0%,100%{opacity:.35;transform:scale(.72)}50%{opacity:1;transform:scale(1.24)}}
@media(max-width:560px){.st-head,.cd,.row,.sec,.banner,.note-row{padding-left:18px;padding-right:18px}.row{grid-template-columns:1fr}.tags{justify-content:flex-start}.st-head{flex-wrap:wrap}}
</style>
</head>

function build(st){

    for(const e of E){
      if(e.t!=='S'||!same(norm(e.n),k)||(S&&e.sec!==S))continue;
      names.push(norm(e.n));sm[norm(e.n)]=S;gm[norm(e.n)]=G;
      const mode=(e.t==='V'||e.r==='VCR')?'VCR':(e.t==='L'&&G)?((G==='C')===(e.di<3)?'FTF':'VCR'):'';
      out.push({...e,G,mode});
    }
  }
  return{out,names,sm,gm};
}

    W=cv.width=innerWidth;Hh=cv.height=innerHeight;cols=[];nodes=[];edges=[];
    for(let i=0;i<Math.floor(W/26);i++)cols.push({x:i*26+13,y:Math.random()*-Hh,sp:.25+Math.random()*.42,len:6+Math.floor(Math.random()*12),cs:Array.from({length:18},()=>ch[Math.floor(Math.random()*ch.length)]),t:0});
    for(let i=0;i<Math.floor(W*Hh/76000);i++)nodes.push({x:Math.random()*W,y:Math.random()*Hh,r:1.4+Math.random()*2,p:Math.random()*6.28,s:.006+Math.random()*.01});
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++)if(Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y)<170)edges.push([i,j]);
  }
  function draw(){
    c.fillStyle='#0b1220';c.fillRect(0,0,W,Hh);
    c.strokeStyle='rgba(125,211,252,.035)';c.lineWidth=.5;
    for(let x=0;x<W;x+=58){c.beginPath();c.moveTo(x,0);c.lineTo(x,Hh);c.stroke()}
    for(let y=0;y<Hh;y+=58){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
    for(const[i,j]of edges){const a=nodes[i],b=nodes[j];c.strokeStyle=`rgba(125,211,252,${(1-Math.hypot(b.x-a.x,b.y-a.y)/170)*.1})`;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
    for(const n of nodes){n.p+=n.s;c.beginPath();c.arc(n.x,n.y,n.r,0,6.28);c.fillStyle=`rgba(248,212,155,${.16+.16*Math.sin(n.p)})`;c.fill()}
    c.font='12px "DM Mono",monospace';
    for(const o of cols){
      o.y+=o.sp;if(++o.t>12){o.t=0;o.cs[Math.floor(Math.random()*18)]=ch[Math.floor(Math.random()*ch.length)]}
      for(let k=0;k<o.len;k++){const y=o.y-k*17;if(y<-17||y>Hh+17)continue;const al=k?Math.max(0,1-k/o.len)*.12:.55;c.fillStyle=k?`rgba(125,211,252,${al})`:`rgba(237,242,247,${al})`;c.fillText(o.cs[k%18],o.x-5,y)}
      if(o.y-o.len*17>Hh){o.y=Math.random()*-220;o.sp=.25+Math.random()*.42;o.len=6+Math.floor(Math.random()*12)}
    }
    requestAnimationFrame(draw);
  }
  init();draw();addEventListener('resize',init);
})();

loadAll();
</script>
